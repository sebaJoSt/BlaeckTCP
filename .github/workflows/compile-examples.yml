name: Compile Examples

on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.board.fqbn }}
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false

      matrix:
        board:
          # --- The Mega builds every topic example, WaveformGenerator with OTA and Bonjour. ---
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
              - name: Ethernet
              - name: EthernetBonjour
              - name: ArduinoOTA
            sketch-paths: |
              - examples/Basic
              - examples/Commands
              - examples/EventChannels
              - examples/SineGenerator
              - examples/StateChannels
              - examples/TimeStampModes
              - examples/WaveformGenerator
              - examples/WriteModes
            artifact-name-suffix: arduino-avr-mega
          - fqbn: arduino:esp32:nano_nora
            platforms: |
              - name: arduino:esp32
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/MoreBoards/WiFi
            artifact-name-suffix: arduino-esp32-nano_nora
          - fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/MoreBoards/WiFi
            artifact-name-suffix: arduino-renesas_uno-unor4wifi
          # --- Espressif ESP32 core: the ETH-based boards. These need esp32:esp32 from the
          #     Espressif package index - arduino:esp32 does not carry the Olimex, WT32 or C6
          #     board definitions. The ESP32-PoE builds every topic example but
          #     WaveformGenerator, which has a job of its own below. ---
          - fqbn: esp32:esp32:esp32-poe
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/Basic
              - examples/BridgeESP32PoE
              - examples/Commands
              - examples/EventChannels
              - examples/SineGenerator
              - examples/StateChannels
              - examples/TimeStampModes
              - examples/WriteModes
            artifact-name-suffix: esp32-esp32-poe
          - fqbn: esp32:esp32:wt32-eth01
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/Basic
              - examples/SineGenerator
            artifact-name-suffix: esp32-wt32-eth01
          - fqbn: esp32:esp32:esp32c6
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/MoreBoards/ESP32C6BugBoard
            artifact-name-suffix: esp32-esp32c6
          # --- The Giga keeps its update on the QSPI flash, which takes Arduino_Portenta_OTA. ---
          - fqbn: arduino:mbed_giga:giga
            platforms: |
              - name: arduino:mbed_giga
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
              - name: Ethernet
              - name: EthernetBonjour
              - name: ArduinoOTA
              - name: Arduino_Portenta_OTA
            sketch-paths: |
              - examples/SineGenerator
              - examples/WaveformGenerator
            artifact-name-suffix: arduino-mbed_giga-giga

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: ${{ matrix.board.sketch-paths }}
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save sketches report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: sketches-report-${{ matrix.board.artifact-name-suffix }}

  # WaveformGenerator with OTA on the ESP32-PoE needs the Library Manager's ArduinoOTA, and the
  # ESP32 core bundles another library of that name that takes priority. So this job deletes
  # the bundled one first, as examples/WaveformGenerator/README.md tells a person to.
  waveform-esp32-poe:
    name: WaveformGenerator on esp32:esp32:esp32-poe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the core and the libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install CRC TelnetStream ArduinoOTA

      - name: Delete the core's bundled ArduinoOTA
        run: rm -rf ~/.arduino15/packages/esp32/hardware/esp32/*/libraries/ArduinoOTA

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32-poe --library . examples/WaveformGenerator
