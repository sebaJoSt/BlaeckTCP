name: Compile Examples

on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.board.fqbn }}
    runs-on: ubuntu-latest

    env:
      SKETCHES_REPORTS_PATH: sketches-reports

    strategy:
      fail-fast: false

      matrix:
        board:
          - fqbn: arduino:avr:mega
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
              - name: Ethernet
              - name: EthernetBonjour
            sketch-paths: |
              - examples/BasicEthernet
              - examples/SineGeneratorEthernet
              - examples/SineGeneratorAndCommandsEthernet
              - examples/SineGeneratorEthernetBonjour
              - examples/CommandsEthernet
              - examples/BridgeEthernet
              - examples/WriteModesEthernet
              - examples/WaveformGeneratorEthernet
            artifact-name-suffix: arduino-avr-mega
          - fqbn: arduino:esp32:nano_nora
            platforms: |
              - name: arduino:esp32
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/SineGeneratorWiFi
            artifact-name-suffix: arduino-esp32-nano_nora
          - fqbn: arduino:renesas_uno:unor4wifi
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/SineGeneratorWiFiS3
              - examples/TimeStampModesWiFiS3
            artifact-name-suffix: arduino-renesas_uno-unor4wifi
          # --- Espressif ESP32 core: the ETH-based examples.
          #     These need esp32:esp32 from the Espressif package index -
          #     arduino:esp32 does not carry the Olimex, WT32 or C6 board
          #     definitions. Each example is built for the board it is written
          #     for, so the FQBN documents its target. ---
          - fqbn: esp32:esp32:esp32-poe
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/BasicESP32PoE
              - examples/BridgeESP32PoE
              - examples/SineGeneratorESP32PoE
              - examples/WaveformGeneratorESP32PoE
            artifact-name-suffix: esp32-esp32-poe
          - fqbn: esp32:esp32:wt32-eth01
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/BasicWT32-ETH01
              - examples/BridgeWT32-ETH01
            artifact-name-suffix: esp32-wt32-eth01
          - fqbn: esp32:esp32:esp32c6
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: CRC
              - name: TelnetStream
            sketch-paths: |
              - examples/BasicESP32C6Bug
            artifact-name-suffix: esp32-esp32c6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: ${{ matrix.board.sketch-paths }}
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}

      - name: Save sketches report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: ${{ env.SKETCHES_REPORTS_PATH }}
          name: sketches-report-${{ matrix.board.artifact-name-suffix }}
