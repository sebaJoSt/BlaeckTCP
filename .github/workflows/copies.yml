name: Copies

# Two sets of files are copies that must not drift, and nothing but this check notices when
# one does.

on:
  push:
    paths:
      - ".github/workflows/copies.yml"
      - "src/BlaeckCore.h"
      - "src/BlaeckCore.cpp"
      - "extras/core-source.txt"
      - "extras/scripts/syncnetwork.py"
      - "examples/**/NetworkSetup.h"
  pull_request:
    paths:
      - ".github/workflows/copies.yml"
      - "src/BlaeckCore.h"
      - "src/BlaeckCore.cpp"
      - "extras/core-source.txt"
      - "extras/scripts/syncnetwork.py"
      - "examples/**/NetworkSetup.h"
  workflow_dispatch:

jobs:
  # BlaeckCore.h and BlaeckCore.cpp are changed only in BlaeckSerial and copied here by
  # extras/scripts/synccore.py, which records the source commit. A hand edit here would
  # make the two libraries send different frames without anyone deciding they should.
  core:
    name: The core matches BlaeckSerial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the recorded BlaeckSerial commit
        run: |
          commit=$(tr -d '\r\n' < extras/core-source.txt)
          echo "BlaeckSerial $commit"
          for f in src/BlaeckCore.h src/BlaeckCore.cpp; do
            curl -fsSL "https://raw.githubusercontent.com/sebaJoSt/BlaeckSerial/$commit/$f" -o /tmp/source
            if ! cmp -s /tmp/source "$f"; then
              echo "::error file=$f::$f differs from BlaeckSerial $commit. Change the core in"
              echo "BlaeckSerial and run extras/scripts/synccore.py rather than editing it here."
              exit 1
            fi
            echo "$f matches"
          done

  # Keep examples self-contained, with Basic as the source for NetworkSetup.h.
  network:
    name: Every NetworkSetup.h is the same
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the copies
        run: python3 extras/scripts/syncnetwork.py --check
